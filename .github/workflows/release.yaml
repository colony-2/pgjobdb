name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write # for keyless container signing
  checks: read

jobs:
  # Step 1: Wait for tests (only when triggered by main push)
  wait-for-tests:
    if: github.ref_type == 'branch' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for test workflow to complete
        uses: lewagon/wait-on-check-action@v1.6.1
        with:
          ref: ${{ github.sha }}
          check-name: 'test-summary'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  # Step 2: Create tag (only when triggered by main push, after tests pass)
  create-tag:
    needs: wait-for-tests
    if: github.ref_type == 'branch' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true
          PRERELEASE: false
          RELEASE_BRANCHES: main

  # Step 3: Run GoReleaser (for both main push after tag creation, and manual tag pushes)
  goreleaser:
    needs: [ create-tag ]
    if: |
      always() &&
      (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Keep module checksums outside the checkout
        run: |
          cp go.mod "$RUNNER_TEMP/pgjobdb-release.mod"
          cp go.sum "$RUNNER_TEMP/pgjobdb-release.sum"
          echo "GOFLAGS=-modfile=$RUNNER_TEMP/pgjobdb-release.mod" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Configure Git and Go for Private Modules
        env:
          REPO_READ_TOKEN: ${{ secrets.READ_ALL_C2_REPOS }}
        run: |
          go env -w GOPRIVATE=github.com/colony-2/*
          printf 'machine github.com login x-access-token password %s\n' "$REPO_READ_TOKEN" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"

      - name: Run tests
        # Custom HOME ONLY for this step, and outside the workspace
        env:
          HOME: ${{ runner.temp }}/test-home
        run: |
          mkdir -p "$HOME"
          go test -v -tags=integration ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: 'v2.18.1'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
